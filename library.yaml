
version: 1

name: Agent Capability Library
description: A personal index of reusable tools, methods, and proven solutions for AI agents.

capabilities:
  - id: website-to-raw-data-xhs
    name: Xiaohongshu Data Collection
    category: data-collection
    description: >
      Collect structured raw data from Xiaohongshu using
      HTTP APIs, request signing, and session management.
      Provides reusable insights into website data extraction.

    tags:
      - web-scraping
      - data-collection
      - http-api
      - reverse-engineering

    source: https://github.com/cv-cat/Spider_XHS
    details: skills/website-to-raw-data-xhs.md

    verification: reproduced

  - id: profile-filtering
    name: AI News Editorial Filtering
    category: research-curation
    description: >
      Select substantive resources on AI epistemology and human agency using relevance, full-text reading, attribution, and evidence requirements.
    tags:
      - editorial-filtering
      - ai-epistemology
      - human-agency
    details: skills/profile-filtering.md
    verification: used-in-project

  - id: summarizer
    name: Deep Digest Summarizer
    category: reading-and-summarization
    description: >
      Produce self-contained bilingual digests that reconstruct the core problem, reasoning, concrete examples, and conclusions for a statistics-trained reader.
    tags:
      - summarization
      - bilingual
      - concept-explanation
    details: skills/summarizer.md
    verification: used-in-project

  - id: polisher
    name: Native Chinese Academic Polisher
    category: writing-and-editing
